<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poder &amp; Mercado</title>
  <meta name="description" content="Indicadores da economia brasileira desde 1995, com o fundo colorido por governo.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    // Aplica o tema antes da pintura (sem piscar). Padrão: escuro.
    (function () {
      var t = "dark";
      try {
        var salvo = localStorage.getItem("pm_tema");
        if (salvo === "light" || salvo === "dark") t = salvo;
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#" aria-label="Poder &amp; Mercado">
        <img class="logo logo-escuro" src="assets/logo.png" alt="Poder &amp; Mercado" width="695" height="61">
        <img class="logo logo-claro" src="assets/logo-claro.png" alt="" width="695" height="61" aria-hidden="true">
      </a>
      <button type="button" class="icon-btn" id="tema" aria-label="Alternar modo escuro" title="Alternar modo escuro">
        <svg class="ico-sol" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-lua" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <nav class="chips" id="chips" aria-label="Indicadores"></nav>
  </header>

  <main id="graficos" class="graficos" aria-live="polite">
    <p class="estado">Carregando indicadores…</p>
  </main>

  <footer class="rodape" id="rodape"></footer>

  <script src="app.js?v=4"></script>
</body>
</html>
